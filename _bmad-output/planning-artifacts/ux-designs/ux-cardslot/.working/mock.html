<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CardSlot mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=block" rel="stylesheet">
<style>
/* ── Card colours: shared by every direction (glossary color_0..5) ── */
:root{
  --c0:#F2475B; --c0d:#B92639; --c1:#3D8BFF; --c1d:#1F5FCC; --c2:#FFC93C; --c2d:#D99A0B;
  --c3:#3CC26B; --c3d:#22924A; --c4:#9B5CF6; --c4d:#6C35C4; --c5:#FF8A3D; --c5d:#D35F14;
  --font:'Fredoka','Segoe UI Rounded','Segoe UI',system-ui,sans-serif;
}
/* ── Direction A: Lavender Candy ── */
.th-a{ --g1:#F1ECFF; --g2:#D8CFFA; --tray:#FFFFFF; --trayRim:#B7A6F2; --trayIn:#EEE9FF;
  --ink:#3A2E6E; --inkSoft:#7C70B0; --acc:#FF7A59; --accD:#D9502F; --acc2:#5B4BD6; --acc2D:#3D2FA8;
  --pill:#FFFFFF; --rail:#CFC4F6; --cell:#E6E0FD; --dim:rgba(40,25,90,.55); }
/* ── Direction B: Warm Toybox ── */
.th-b{ --g1:#FFF6E6; --g2:#FFD9A8; --tray:#E9A866; --trayRim:#B9733A; --trayIn:#F6CF98;
  --ink:#5A3415; --inkSoft:#9A6A3F; --acc:#21B8A6; --accD:#138A7B; --acc2:#E8613C; --acc2D:#B7411F;
  --pill:#FFF8EC; --rail:#C98B52; --cell:#F2C68C; --dim:rgba(70,35,10,.55); }
/* ── Direction C: Sky Mint ── */
.th-c{ --g1:#D9FAF3; --g2:#9FE2EF; --tray:#FFFFFF; --trayRim:#68C3D6; --trayIn:#E3F7F9;
  --ink:#12455A; --inkSoft:#4E8796; --acc:#FFB703; --accD:#D18B00; --acc2:#1F9BB8; --acc2D:#127389;
  --pill:#FFFFFF; --rail:#8FD5E2; --cell:#D3F1F5; --dim:rgba(10,50,65,.55); }

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;overflow:hidden;background:#222}
.stage{position:relative;width:1080px;height:var(--h,1920px);overflow:hidden;font-family:var(--font);color:var(--ink);
  background:radial-gradient(1200px 900px at 50% 10%,var(--g1),var(--g2));}
/* soft background confetti dots */
.stage::before{content:"";position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(circle at 20% 30%,#fff 0 10px,transparent 11px),radial-gradient(circle at 80% 20%,#fff 0 6px,transparent 7px),
  radial-gradient(circle at 70% 75%,#fff 0 12px,transparent 13px),radial-gradient(circle at 12% 82%,#fff 0 7px,transparent 8px);}

/* ── chunky 3D-look primitives ── */
.pill{position:absolute;height:96px;border-radius:48px;background:var(--pill);display:flex;align-items:center;gap:14px;padding:0 30px 0 14px;
  font-size:44px;font-weight:700;box-shadow:0 8px 0 rgba(0,0,0,.12),0 14px 24px rgba(0,0,0,.08)}
.coin{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC93C 55%,#E39A00);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);display:grid;place-items:center;font-size:36px;color:#B57400;font-weight:700}
.rbtn{position:absolute;width:104px;height:104px;border-radius:32px;background:var(--acc2);box-shadow:0 10px 0 var(--acc2D),0 18px 24px rgba(0,0,0,.15);
  display:grid;place-items:center;color:#fff}
.btn{position:absolute;left:50%;transform:translateX(-50%);border-radius:56px;color:#fff;font-weight:700;display:grid;place-items:center;
  text-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.primary{background:linear-gradient(var(--acc),var(--acc));box-shadow:0 14px 0 var(--accD),0 26px 40px rgba(0,0,0,.18)}
.btn.secondary{background:var(--acc2);box-shadow:0 12px 0 var(--acc2D),0 22px 30px rgba(0,0,0,.15)}
.btn::after{content:"";position:absolute;left:24px;right:24px;top:10px;height:34%;border-radius:40px;background:rgba(255,255,255,.28)}

/* ── cards ── */
.card{position:absolute;width:var(--cw,150px);height:var(--ch,206px);border-radius:24px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--k) 70%,#fff) 0%,var(--k) 38%,var(--k) 100%);
  box-shadow:0 10px 0 var(--kd),0 16px 18px rgba(0,0,0,.18);display:grid;place-items:center}
.card::before{content:"";position:absolute;inset:12px;border-radius:16px;border:5px solid rgba(255,255,255,.55)}
.card svg{width:56%;height:auto;fill:#fff;opacity:.95;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.edge{position:absolute;width:var(--cw,150px);height:var(--ch,206px);border-radius:24px;background:var(--k);box-shadow:0 8px 0 var(--kd)}
.covered{filter:brightness(.68)}
.covered.card::after{content:"";position:absolute;inset:0;border-radius:24px;background:repeating-linear-gradient(135deg,rgba(0,0,0,.10) 0 14px,transparent 14px 28px)}
.k0{--k:var(--c0);--kd:var(--c0d)} .k1{--k:var(--c1);--kd:var(--c1d)} .k2{--k:var(--c2);--kd:var(--c2d)}
.k3{--k:var(--c3);--kd:var(--c3d)} .k4{--k:var(--c4);--kd:var(--c4d)} .k5{--k:var(--c5);--kd:var(--c5d)}

/* ── gameplay zones ── */
.zone{position:absolute;left:40px;right:40px;border-radius:48px}
.targets{top:200px;height:400px}
.tslot{position:absolute;top:0;width:300px;height:400px;border-radius:40px;background:rgba(255,255,255,.55);
  box-shadow:inset 0 6px 0 rgba(255,255,255,.7),0 8px 0 rgba(0,0,0,.06)}
.tbase{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:230px;height:70px;border-radius:35px;background:var(--k);box-shadow:0 10px 0 var(--kd)}
.tbase::after{content:"";position:absolute;left:18px;right:18px;top:8px;height:22px;border-radius:12px;background:rgba(255,255,255,.35)}
.tcount{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);font-size:40px;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);z-index:3}
.next{position:absolute;top:-6px;right:12px;display:flex;gap:10px;align-items:center;font-size:28px;color:var(--inkSoft);font-weight:600}
.chip{width:34px;height:46px;border-radius:9px;background:var(--k);box-shadow:0 4px 0 var(--kd)}
.buffer{top:650px;height:200px;background:var(--rail);box-shadow:inset 0 10px 0 rgba(0,0,0,.12),0 10px 0 rgba(255,255,255,.5)}
.cell{position:absolute;top:30px;width:66px;height:140px;border-radius:16px;background:var(--cell);box-shadow:inset 0 6px 0 rgba(0,0,0,.08)}
.cell.card{--cw:66px;--ch:140px;border-radius:16px;box-shadow:0 6px 0 var(--kd);
  background:linear-gradient(180deg,color-mix(in srgb,var(--k) 70%,#fff) 0%,var(--k) 38%,var(--k) 100%)}
.cell.card::before{inset:7px;border-width:3px;border-radius:10px}
.cell.card svg{width:70%}
.bufLabel{position:absolute;top:610px;left:70px;font-size:30px;font-weight:600;color:var(--inkSoft)}
.bufCount{position:absolute;top:610px;right:70px;font-size:30px;font-weight:700;color:var(--ink)}
.board{top:900px;height:var(--boardH,760px);background:var(--trayRim);box-shadow:0 14px 0 rgba(0,0,0,.14),0 30px 50px rgba(0,0,0,.12)}
.boardIn{position:absolute;inset:22px;border-radius:34px;background:var(--trayIn);box-shadow:inset 0 12px 0 rgba(0,0,0,.08)}
.boosters{position:absolute;left:0;right:0;bottom:60px;height:170px}
.boost{position:absolute;bottom:0;width:170px;height:170px;border-radius:48px;background:var(--pill);box-shadow:0 12px 0 rgba(0,0,0,.14),0 20px 30px rgba(0,0,0,.1);
  display:grid;place-items:center}
.boost svg{width:84px;height:84px;fill:var(--acc2)}
.badge{position:absolute;top:-16px;right:-16px;min-width:64px;height:64px;border-radius:32px;background:var(--acc);color:#fff;font-size:36px;font-weight:700;
  display:grid;place-items:center;padding:0 12px;box-shadow:0 6px 0 var(--accD)}
.price{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);height:56px;border-radius:28px;background:var(--ink);color:#fff;font-size:30px;font-weight:700;
  display:flex;align-items:center;gap:8px;padding:0 18px 0 8px;white-space:nowrap}
.price .coin{width:42px;height:42px;font-size:22px}
.bname{position:absolute;bottom:-78px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:600;color:var(--inkSoft);white-space:nowrap}

/* ── home ── */
.logo{position:absolute;top:330px;left:0;right:0;text-align:center;font-size:150px;font-weight:700;letter-spacing:2px;color:#fff;
  text-shadow:0 10px 0 var(--acc2D),0 20px 30px rgba(0,0,0,.18);-webkit-text-stroke:6px var(--acc2D);paint-order:stroke fill}
.tag{position:absolute;top:530px;left:0;right:0;text-align:center;font-size:42px;font-weight:600;color:var(--inkSoft)}
.fan{position:absolute;top:720px;left:50%;width:0;height:0}

/* ── dialog ── */
.dim{position:absolute;inset:0;background:var(--dim);z-index:10}
.panel{z-index:11;position:absolute;left:90px;right:90px;top:420px;height:1000px;border-radius:64px;background:var(--pill);
  box-shadow:0 18px 0 rgba(0,0,0,.18),0 40px 80px rgba(0,0,0,.3)}
.ribbon{position:absolute;left:-30px;right:-30px;top:-70px;height:170px;border-radius:44px;background:var(--acc2);box-shadow:0 14px 0 var(--acc2D);
  color:#fff;font-size:76px;font-weight:700;display:grid;place-items:center;text-shadow:0 5px 0 rgba(0,0,0,.2)}
.conf{z-index:12;position:absolute;width:26px;height:44px;border-radius:8px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const theme = P.get('theme') || 'a', screen = P.get('screen') || 'gameplay', H = +(P.get('h') || 1920);
const tall = H - 1920; // extra height on long phones goes to the board
const EMB = [ // heart, drop, star, leaf, moon, circle — one emblem per colour (glossary)
 '<svg viewBox="0 0 100 100"><path d="M50 88 12 50C-2 34 8 10 28 10c10 0 17 6 22 14 5-8 12-14 22-14 20 0 30 24 16 40z"/></svg>',
 '<svg viewBox="0 0 100 100"><path d="M50 6C50 6 16 46 16 64a34 34 0 0 0 68 0C84 46 50 6 50 6z"/></svg>',
 '<svg viewBox="0 0 100 100"><path d="m50 5 13 29 31 3-23 21 7 31-28-16-28 16 7-31L6 37l31-3z"/></svg>',
 '<svg viewBox="0 0 100 100"><path d="M86 10C40 8 10 30 12 70l-6 20 8 2 6-16c40 6 66-24 66-66zM30 70c10-20 26-34 44-44-16 14-30 28-40 48z"/></svg>',
 '<svg viewBox="0 0 100 100"><path d="M62 6a44 44 0 1 0 32 66A36 36 0 0 1 62 6z"/></svg>',
 '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg>'];
const card = (k, x, y, cls='', w=150, h=206) => `<div class="card k${k} ${cls}" style="left:${x}px;top:${y}px;--cw:${w}px;--ch:${h}px">${EMB[k]}</div>`;
// a stack: cards[0] is the top; lower cards peek out as coloured edges below it
function stack(x, y, cards, covered){
  let s = '';
  for (let i = cards.length - 1; i >= 1; i--) s += `<div class="edge k${cards[i]} ${covered?'covered':''}" style="left:${x}px;top:${y + i*16}px"></div>`;
  return s + card(cards[0], x, y, covered ? 'covered' : '');
}
const ICON_PAUSE = '<svg width="48" height="48" viewBox="0 0 10 10" fill="#fff"><rect x="1.5" y="1" width="2.4" height="8" rx="1"/><rect x="6.1" y="1" width="2.4" height="8" rx="1"/></svg>';
const ICON_RESTART = '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v5h-5"/></svg>';
const ICON_GEAR = '<svg width="56" height="56" viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.6 7.6 0 0 0-1.7-1L14.9 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.4L6.4 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.4zM12.9 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>';
const ICON_UNDO = '<svg viewBox="0 0 24 24"><path d="M9 5 3 10.5 9 16v-4c5 0 8 1.5 10 5-1-5-4-9-10-9.5z"/></svg>';
const ICON_SPACE = '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="5" height="10" rx="1.5"/><rect x="9.5" y="7" width="5" height="10" rx="1.5" opacity=".55"/><path d="M19 8v3h-3v2h3v3h2v-3h3v-2h-3V8z"/></svg>';

function topBar(level, coins, hard){
  return `<div class="pill" style="left:40px;top:70px"><div class="coin">$</div>${coins}</div>
  <div class="pill" style="left:50%;transform:translateX(-50%);top:70px;padding:0 40px">Level ${level}${hard?` <span style="background:var(--c0);color:#fff;border-radius:22px;padding:2px 16px;font-size:30px;margin-left:6px">HARD</span>`:''}</div>
  <div class="rbtn" style="right:176px;top:66px">${ICON_RESTART}</div>
  <div class="rbtn" style="right:40px;top:66px">${ICON_PAUSE}</div>`;
}
function gameplay(level = 23, hard = false){
  let s = topBar(level, "9,999", hard);
  // targets: colour, filled, capacity
  const T = [[0,2,3],[1,0,3],[2,1,3]];
  s += `<div class="zone targets">`;
  T.forEach(([k,f,c],i)=>{
    const x = i*340;
    s += `<div class="tslot" style="left:${x}px">`;
    for (let j=0;j<f;j++) s += card(k, 75, 120 - j*34, '', 150, 206);
    s += `<div class="tbase k${k}"></div><div class="tcount">${f}/${c}</div></div>`;
  });
  s += `<div class="next">next <div class="chip k3"></div><div class="chip k0"></div></div></div>`;
  // buffer: capacity 12, 5 used — none matches a target with room (R-10 invariant)
  const B = [3,3,4,5,5];
  s += `<div class="bufLabel">Holding area</div><div class="bufCount">5 / 12</div><div class="zone buffer">`;
  for (let i=0;i<12;i++){ const x = 34 + i*80; s += i < B.length ? `<div class="cell card k${B[i]}" style="left:${x}px">${EMB[B[i]]}</div>` : `<div class="cell" style="left:${x}px"></div>`; }
  s += `</div>`;
  // board
  s += `<div class="zone board" style="--boardH:${650+tall}px"><div class="boardIn">`;
  const oy = Math.round(tall/2);
  s += stack(60, 60+oy, [1,1,4,0], false) + stack(250, 30+oy, [5,5,2], true) + stack(480, 60+oy, [2,2,2,3], false)
     + stack(310, 110+oy, [0,0,1], false) + stack(630, 30+oy, [4,3], true) + stack(720, 90+oy, [3,0,0,5], false)
     + stack(120, 330+oy, [5,1,1], false) + stack(380, 360+oy, [1,2], false) + stack(620, 330+oy, [4,4,0], false);
  s += `</div></div>`;
  // boosters
  s += `<div class="boosters" style="bottom:${110}px">
    <div class="boost" style="left:250px">${ICON_UNDO}<div class="badge">2</div><div class="bname">Undo</div></div>
    <div class="boost" style="left:660px">${ICON_SPACE}<div class="price"><div class="coin">$</div>100</div><div class="bname" style="bottom:-92px">Extra Space</div></div>
  </div>`;
  return s;
}
function home(){
  let s = `<div class="pill" style="left:40px;top:70px"><div class="coin">$</div>9,999</div>
    <div class="rbtn" style="right:40px;top:66px">${ICON_GEAR}</div>
    <div class="logo">CardSlot</div><div class="tag">Tap. Match. Clear!</div>`;
  // decorative fan of cards
  const fan = [0,1,2,3,4,5];
  s += `<div class="fan" style="top:${760+tall/3}px">`;
  fan.forEach((k,i)=>{ const a = (i-2.5)*12; s += `<div style="position:absolute;left:-90px;top:0;transform-origin:90px 520px;transform:rotate(${a}deg)">${card(k,0,0,'',180,250)}</div>`; });
  s += `</div>`;
  s += `<div class="btn primary" style="top:${1360+tall*.6}px;width:640px;height:190px;font-size:84px">Level 30</div>
        <div style="position:absolute;top:${1590+tall*.6}px;left:0;right:0;text-align:center;font-size:34px;color:var(--inkSoft);font-weight:600">More levels coming soon</div>`;
  return s;
}
function win(){
  let s = gameplay(25, true) + `<div class="dim"></div>`;
  const C = ['--c0','--c1','--c2','--c3','--c4','--c5'];
  for (let i=0;i<26;i++){ const x=(i*137)%1040, y=200+((i*251)%700), r=(i*47)%180; s += `<div class="conf" style="left:${x}px;top:${y}px;background:var(${C[i%6]});transform:rotate(${r}deg)"></div>`; }
  s += `<div class="panel" style="top:${400+tall/2}px;height:1120px"><div class="ribbon">Hard Level Cleared!</div>
     <div style="position:absolute;top:200px;left:0;right:0;text-align:center;font-size:54px;font-weight:600;color:var(--inkSoft)">Level 25</div>`;
  s += `<div style="position:absolute;top:300px;left:50%;width:0">${[2,0,1].map((k,i)=>`<div style="position:absolute;left:-75px;transform-origin:75px 300px;transform:rotate(${(i-1)*16}deg)">${card(k,0,0)}</div>`).join('')}</div>`;
  s += `<div class="pill" style="left:50%;transform:translateX(-50%);top:600px;height:120px;font-size:64px;padding:0 44px 0 18px;background:var(--cell)"><div class="coin" style="width:88px;height:88px;font-size:46px">$</div>+30</div>
     <div class="btn primary" style="top:790px;width:560px;height:160px;font-size:72px">Next</div>
     <div style="position:absolute;top:1000px;left:0;right:0;text-align:center;font-size:44px;font-weight:600;color:var(--inkSoft)">Home</div></div>`;
  return s;
}
document.getElementById('root').innerHTML =
  `<div class="stage th-${theme}" style="--h:${H}px">${({gameplay,home,win})[screen]()}</div>`;
</script>
</body>
</html>
