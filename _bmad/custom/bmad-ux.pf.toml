# PrototypeFramework layer for bmad-ux.
#
# Lands in a SKU as _bmad/custom/bmad-ux.pf.toml, written by the agent-doc sync, and merges between the
# skill's customize.toml and the SKU's _bmad/custom/bmad-ux.toml (see bmad-build-auto.pf.toml for the
# layering). bmad-ux designs screens, and nothing in it asks whether the game's world is made of 3D
# models. So a 3D game reached architecture and the build with no model list, no approved look per
# model and no budget, and every model got decided story by story. These entries make the models part
# of the design package: the list is decided at Discovery, and the models are built with pf-model-gen at
# Finalize.

[workflow]

persistent_facts = [
  "3D models are a design-package deliverable when the game's world is drawn with 3D models. Decide it at Discovery's concern scan from the sources: 3D means the GDD, spec or art direction names a 3D world (a perspective or orthographic 3D camera over meshes; modelled vehicles, characters, buildings, machines or props). A 2D game, or 3D-looking sprites, is not 3D. Log the decision with memlog either way. When it is 3D: (1) Build the model list with the user and log it. One row per model that needs its own silhouette: id, what it is, its overall bounding box in metres (width × height × length, from the GDD's layout numbers when they exist), palette keys from DESIGN.md colors, a triangle budget from the GDD's performance budget, and the parts that must stay separate because they move. (2) At Finalize, once DESIGN.md colors and the key-screen mocks are approved, run the `pf-model-gen` skill for each model. Write a request at `Tools/ModelGen/requests/<id>.json` with `out: {doc_workspace}/models/<id>` and the approved mockups as style references, then run `model-gen.py blueprint`. Show the user every variant and wait for their pick. A blueprint the user approved (status `approved` in its .gen.json, written when they say so) is the model's design sign-off; never build a model from one they have not seen. Then run `model-gen.py build` in the background, show its hero.png and compare.png, and `select` the one they pick. (3) Write `{doc_workspace}/MODELS.md` with `python3 Tools/pf/model-gen.py status --under {doc_workspace} --md {doc_workspace}/MODELS.md`. Link it from DESIGN.md (Components or Shapes), and list each model not yet built there as an open item with an owner; never leave one out. Keep to the skill's budget: after two missed rounds, stop and take the request back to the user instead of running a third. When the game is 2D, say so in one line and do none of this.",
]

creative_tools = [
  "3D model renderer: load the `pf-model-gen` skill (`Tools/pf/model-gen.py`). It draws orthographic blueprint sheets that settle a model's look, then builds FBX models in Blender from the approved ones. Output goes under {doc_workspace}/models/. Use it only when the 3D-models fact says the game's world is drawn with 3D models.",
]
