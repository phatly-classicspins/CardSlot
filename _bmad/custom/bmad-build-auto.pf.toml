# PrototypeFramework layer for bmad-build-auto (the unattended bmad-loop build).
#
# Lands in a SKU as _bmad/custom/bmad-build-auto.pf.toml, written by the agent-doc sync. The BMAD
# fork merges it BETWEEN the skill's own customize.toml and the SKU's _bmad/custom/bmad-build-auto.toml:
#   base  <  <skill>.pf.toml (this file)  <  <skill>.toml (the SKU's)  <  <skill>.user.toml
# `persistent_facts` APPENDS to the base list, and the SKU's file appends after it; `thorough_lenses`
# merge by `id`, so a SKU entry with the same id replaces one of these. Put a SKU's own facts in its
# <skill>.toml — never here.
#
# Only APPEND-shaped keys live here on purpose. A scalar (route_selection, implementation_handoff) set
# in this layer would replace the fork's default wholesale and mask every later fix the fork makes to
# it, so those live in the fork's base customize.toml.
#
# Every fact below was measured on a SKU running bmad-loop against this framework; the numbers are
# kept as the reason, not as targets.

[workflow]

persistent_facts = [
  "Round-trip discipline: every turn re-sends the whole context, so an extra turn costs far more than an extra tool call inside a turn. Put independent calls — parallel greps/reads, several edits to one file — in one message, and never batch across a dependency (a compile, a test run, a file not yet read). Three project tools do what a bare parallel call cannot: `Tools/pf/pf-exec` (heredoc of `label : command` lines, run in parallel, each output capped, `read FILE:L1-L2` supported) for inspection; `Tools/pf/pf-mcp` (heredoc of `tool-name {json}` lines, run in order, payload reduced in the shell, screenshots returned as a path, `--stop-on-fail` on by default) for Unity; and `Tools/pf/pf-write` (a JSON array of edit/write/append/delete ops, every item validated before anything is touched, all-or-nothing, the tree rolled back on any failure) for a batch of mutations that must not half-apply. Batched WRITING needs no tool: the host runs every `Write`/`Edit` call a single assistant message carries before it calls you again — measured on a SKU, the same six-file task costs 47k context tokens batched against 330k one-at-a-time — so put every write you already know you need in one message, and keep `pf-write` for the all-or-nothing case.",
  "Follow-up work never goes back to a subagent that has already reported. Its context is large and mostly irrelevant to the new job, and it re-reads the files from disk anyway. Launch a fresh subagent with no prior conversation context, give it the task, the absolute path of the spec with the sections it must read, and the absolute path of the current diff — then wait for it synchronously. This fact names no model, deliberately: the model belongs to whichever step is launching the subagent and is named in that step's own instruction — step-03 and step-04's patch agent name Opus, step-01's epic compiler and step-02's explorers name Sonnet. Where no step names one, pick it for the job: work that summarises, inventories or reads out what is already written goes to Sonnet. Measured on a SKU run: an earlier wording of this fact carried `Opus` as a general rule, and the orchestrator applied it to every subagent it launched — the epic-context compiler cost $3.12 where Sonnet had produced the same file for $0.82 the run before.",
  "Assembly boundary is PLANNING's job, not the compiler's. Each of the SKU's eight product assemblies (plus its Game.Tests.Editor test assembly) carries an exact, routed reference list, and `Tools/pf/typecheck.sh` CANNOT catch an unauthorised edge: Unity regenerates the .csproj from the asmdef, so adding the edge makes the type-check GREENER, not redder. Before an Execution bullet names a type, resolve type -> declaring assembly -> consuming assembly and confirm the edge already exists in the consumer's .asmdef. Read every asmdef under `Assets/<sku>/` in ONE `Tools/pf/pf-exec` call; the authorised table is the SKU's assembly-reference test in `SkuHeadlessTests/` (the Setup Wizard seeds it as `SkuHeadlessTests/Gate/AssemblyReferenceTests.cs`; `rg -l AssemblyReference SkuHeadlessTests` finds a renamed one), asserted every iteration by `sh Tools/pf/gate.sh`. No edge means the bullet is rewritten into a legal shape (a primitive or an index across the boundary, a `static Present(...)` seam, a DispatchProxy) or it becomes an Open Question that ROUTES the edge - never a bullet that silently assumes it. The Code Map carries the declaring assembly beside every type it names, for the same reason it carries line numbers. Measured on a SKU: one story shipped three bullets assuming edges that did not exist (a Views type naming an Application enum; an Editor type naming UniTask through a service interface; a second installer call the root scope already performs), each found mid-implementation and each costing an agent leg plus a redesign. That spec had already WRITTEN the rule in Boundaries -> Never - stating the rule is not checking it.",
  "Route the spine change AT SPEC TIME, and write it down — a stage agent cannot authorise one. Rule 5 / §6 makes a new reference edge an architecture decision, so a stage that needs one is required to stop and report, however small the edit. When planning names a bullet whose tools or types cross an assembly it has no edge to, decide the edge THEN: add a `routed_spine_changes:` list to the spec frontmatter (one entry per edge: `edge`, `needed_by`, `grounds`, `pin_file`), and add the pin file (the SKU's assembly-reference test) to the owned globs of the stage that needs it — the asmdef and the authorised table must move together or the gate turns red and the stage bounces anyway. Measured on a SKU: a Phase-3 bullet needed `Game.Tests.Editor -> Game.Composition`, derivable from the spec alone; instead the stage hit the rule at minute 90, the orchestrator authorised it in 40 seconds, and DELIVERING that 40-second decision cost a cold Opus agent — 34.5 minutes and $15.01 to add three lines to an asmdef.",
  "Never take implementation work into the orchestrator session yourself, however small it looks. A one-line fix carries a verify tail — `sh Tools/pf/gate.sh` plus the EditMode receipt (`Tools/pf/pf-tests --auto`, minutes with the Slow capture tier) plus whatever their output is — and that output lands in the most expensive context in the run. Measured on a SKU: the orchestrator context reached 400k, where one turn cost ~$0.59 against ~$0.33 for a turn in a fresh stage agent. Dispatch it, or fold it into the closeout stage; the orchestrator writes spec frontmatter, sprint bookkeeping and stage prompts, and nothing else.",
  "EditMode verification belongs to the stage agent, and its receipt stands. The stage ends with ONE `Tools/pf/pf-tests --auto` run: every class, with the Slow capture tier only when the diff draws. Never re-run the EditMode suite in this session to double-check it. If you must confirm, `Tools/pf/pf-tests --auto` answers `reused` in under a second when nothing changed since that green run. After a review patch, the patch agent runs the patched classes by name plus one `--auto`. Measured on a SKU: the orchestrator's own re-verification cost ~15 min (a full `tests-run` that hit the 300 s gateway cap, then a per-class retry loop) for a suite the stage had already proved.",
  "A test is a cost every later story pays: every stage re-runs it, and every story that moves a pixel re-writes the ones that pin it. Measured on a SKU after 33 stories: 50k lines of tests against 43k of runtime code; nine capture classes were 91% of a ~320 s EditMode run while ~600 other tests took ~28 s; 70 of 1332 engine-free tests were 22 s of a 24 s leg. So, when planning `## Tasks & Acceptance` and when writing tests: (1) a `kind: finish` row that a picture settles is settled by the capture and `visual-judge.sh`, not by a new field-assertion test. Write a field assertion only for an invariant a picture cannot show (hit area and collider overlap, raycast flags, `LocKey` routing, a wired serialized field), and name the row it covers. A field assertion that pins a position, a colour or a scale is a change detector the next restyle rewrites. (2) Render a fixture through `CaptureHarness.Run`: inside pf-tests a fixture already rendered in the run is reused. `CaptureHarness.RunFresh` is only for a test that compares two renders or changed an input in memory. (3) Build anything expensive a class needs (a generated level, a solver pass, a render) once per class, with `[OneTimeSetUp]` or a static `Lazy<T>`, never once per `[TestCase]` row. Measured: fifteen cases each regenerating the same level cost 6.3 s a run. (4) Never add a test that runs a gate leg's own command (greps.sh, the typecheck) over the real tree; the gate already runs it. (5) Assert a tunable's shape, not its value. A test pinning a config default reddens when design changes it on purpose. (6) Before the stage closes, read the `slowest` lines `sh Tools/pf/gate.sh` and `Tools/pf/pf-tests` print. A new entry over a second is a finding to fix in this stage.",
  "A `kind: finish` spec's `## Visual Contract` ENDS with one fenced ```visual-judge block, and every judge call in the run is `Tools/pf/visual-judge.sh --spec {spec_file} --caller <stage|audit|lens>` with nothing else on the line — no hand-built `--capture`/`--reference` list. The block is how the implementing stage, the step-03 audit and the step-04 lens judge the SAME images: `root:` = the design package the epic's `mockups/…`/`imports/…` paths are relative to; one `reference: <path> | <what it is> — <rows it serves>` line for EVERY image any row compares against (approved mockup, finish benchmarks, pending-user-review specimens, another surface's panel); one `capture: Tools/UiGate/captures/<fixture>.png | fixture <fixture> — <rows>` line per fixture; `notes: DIVERGENCES.md#<surface id>`. A row whose referent is not in the block is an intent gap at planning, never a row the judge is left to guess. Rows are transcribed verbatim from epics.md. When the SKU keeps a transcribed contract under `Tools/UiGate/contracts/<surface id>.md`, copy its rows and block. Put the stage's command in `## Verification` as `Tools/pf/visual-judge.sh --spec {spec_file} --caller stage` (a split finish story names each stage: `--caller stage-<group>`); run the step-03 Visual Contract Audit as `... --caller audit`. The round budget is NOT a number the spec invents: write `Round budget: the judge's LOOP line (Tools/UiGate/judge.conf)` and let every caller follow `LOOP: continue | stop (…) | done` — the policy (fixed rounds, or continue-while-rows-clear) is a tuning knob that lives only in judge.conf. The judge caches by input hash, so the audit and the lens re-judging the stage's final capture cost no model call — re-capturing before the audit is what makes them cost one. Measured on a SKU: before the block existed, the judge took ONE `--reference` (the last flag given silently replaced the others), so a row judged against a benchmark was judged against whichever image happened to be passed last.",
  "A finish story's 'stored as this surface's reference capture' acceptance is closed by `Tools/pf/promote-reference.sh <surface id> <every capture in the block>`, run after the judge exits 0 on those exact bytes, as the last `## Tasks & Acceptance` bullet. It copies them to `Tools/UiGate/references/<surface id>/` (committed) and appends the passing verdict to `PROVENANCE.md` there; it refuses any capture without an `ok` judge record. Never store a reference under `Tools/UiGate/captures/` — that folder is git-ignored regenerated output, so a reference written there does not survive a clone. A person reviews what landed in `references/` at the epic's review gate; the loop does not wait for them.",
  "The visual judge is not deterministic, so ONE call is not a verdict. Measured on a SKU: a byte-identical input judged all-SATISFIED in the morning came back three rows VIOLATED in 3 of 3 re-runs that evening, and a shipped capture drew one row VIOLATED in 1 of 3. So the judge makes `UIGATE_JUDGE_SAMPLES` calls in parallel (2 by default; `Tools/UiGate/judge.conf` may raise it), adds a third for any split row, and counts a row only when 2 calls agree; a row that never gets 2 agreeing votes comes back `VIOLATED — unsettled [votes of 3: …]`. The cache replays a settled verdict, not a single draw. A row that keeps coming back split is a design question for the human review gate, not a reason to iterate the View: say so in `## Auto Run Result` and in deferred-work.md. And let the judge own its clock. It sends JPEG (about 2 MB and 60-80 s per call, against 8 MB and 400-860 s as PNG) under its own 840 s ceiling (`UIGATE_JUDGE_TIMEOUT`). Run it with the Bash `timeout` at `900000` and never inside a shorter `pf-timeout`: seven audit attempts at 280-900 s caps on one SKU were runs the caller killed, not a dead transport, and they cost 104 minutes plus a two-hour escalation.",
  "The judge's reliability is measured, not assumed: `Tools/UiGate/judge-calibration.md` (written by `Tools/pf/judge-calibrate.py`) carries the catch rate, false-positive rate and consistency of the pinned model (`Tools/UiGate/judge.conf`). When its verdict status reads `findings for triage only`, a row still VIOLATED at the end of the round budget is reported in `## Auto Run Result` with the judge's sentence — it is not by itself grounds for `intent gap`. A HALT (exit 3) still is.",
]

# Visual gate. The `## Visual Contract` (step-02, inside the intent-contract) says what a looker must be
# able to see; this lens settles it against the pixels that actually shipped. It exists because a
# sample-point floor was measured blind to two real defects on one surface: goods rendered floating
# with no contact shadow, and a badge whose label broke out of its fill — both passed every floor rung
# and four review lenses. `when` keeps it off every story that renders nothing. Thorough set only: the
# quick set is one lens (route: oneshot) and settles small changes.

[[workflow.thorough_lenses]]
id = "visual-gate"
name = "Visual Gate"
when = "{spec_file} contains a `## Visual Contract` section"
instruction = """
Do not launch a subagent for this lens — run it yourself, it is one command.

1. The `## Visual Contract` in `{spec_file}` must end with a fenced ```visual-judge block naming every capture and every reference its rows use. If it has none, that is the finding: report `visual contract has no visual-judge inputs block — the judge cannot be handed the references the rows compare against` and stop.
2. Run, once:

   Tools/pf/visual-judge.sh --spec {spec_file} --caller lens

   Nothing else on the line: the block supplies the captures, the references and the divergence notes, so this lens judges exactly what the stage and the audit judged. When the capture has not changed since the audit passed, the judge returns that archived verdict as a cache hit — that is the expected result, not a skipped check.

   Exit `0` = no row VIOLATED · `1` = at least one VIOLATED · `2` = the judge could not run,
   which includes a capture that is very nearly one flat colour — a broken capture pipeline,
   not a broken UI · `3` = HALT, the same row came back VIOLATED twice with the capture unmoved.
   On exit `2`, report the failure verbatim as a finding — never treat a judge that did not run as
   a pass, and never restate a broken capture as a defect in the work. On exit `3`, the finding is
   that the row asks the fixture for something it cannot give: report it as an intent gap against
   the row, not as an implementation defect.
3. Report one finding per `VIOLATED` row, quoting the row number and the judge's sentence (it names the capture and the reference it compared).
4. Report one finding per `CANNOT-TELL` row that has no field assertion covering it in `## Tasks & Acceptance` — an unsettled claim with nothing else settling it is an unaudited claim.
5. If the story's acceptance asks for a stored reference capture, report a finding when `Tools/UiGate/references/<surface id>/` does not hold every capture the block names.

Judge nothing yourself beyond that: this layer reports what the contract and the capture say, and never approves a capture as a new reference.
Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""
