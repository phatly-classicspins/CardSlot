# PrototypeFramework layer for bmad-architecture.
#
# Lands in a SKU as _bmad/custom/bmad-architecture.pf.toml, written by the agent-doc sync, and merges
# between the skill's customize.toml and the SKU's _bmad/custom/bmad-architecture.toml (see
# bmad-build-auto.pf.toml for the layering). bmad-architecture reads only the input it is handed plus
# its persistent facts; nothing in it looks for the UX package. So an architecture run reached any
# way (typed, routed by bmad-help, suggested by bmad-ux) ignored the approved design and the asset
# handoff (pf-ux-asset-handoff), and host layer, import pipeline and asset loading got decided
# silently, story by story. This fact makes the package a load-bearing input on every path.
# The second fact does the same for a 3D game's models and clips (pf-model-gen, run from bmad-ux, then
# inventoried by pf-ux-asset-handoff): where a metre-scale world sits on the 1 px = 1 unit rig, how
# models and clips are imported and loaded, and who plays motion.

[workflow]

persistent_facts = [
  "UX package and asset handoff are architecture inputs. Before drafting, look under `{planning_artifacts}/ux-designs/ux-*/` for a bmad-ux package: the one the user names, else the newest whose DESIGN.md has `status: final`. When one exists it is a load-bearing input with the same rank as the spec, without waiting to be told. Read DESIGN.md and EXPERIENCE.md (information architecture, component patterns, layout geometry) and the SURFACES.md front matter. From ASSET-MAP.md read the front matter keys `host`, `draw` and `size_source` plus its open-items section, not the whole per-sprite list. Then decide at spine altitude, or record under Deferred or open questions with an owner: (1) every `host: undecided` object family, following rule 16 (screen-edge uGUI under the owning layer's GetHost vs world Renderer under WorldRoot); (2) how design-package sprite masters become runtime sprites (the resize/import step, PPU 1 through SpriteImportDefaults, atlas partition); (3) how sprites and content pictures are loaded (Addressables vs direct references, the content-picture catalog); (4) any tiled or looping plate. Include the package in Finalize step 2 (Reconcile inputs). If there is no package, or it has no ASSET-MAP.md while UI is in scope, say so in one line and recommend `pf-ux-asset-handoff` before `bmad-create-epics-and-stories`.",
  "3D models and animation clips are an architecture input. When the UX package has `models/model-manifest.json` (written by `pf-ux-asset-handoff`), read it (per model: rig, triangles, size, clips with loop and measured length) and ASSET-MAP.md's `model_import_scale` plus each model's `host`, `rig`, `animation` and `code_parts`, never the FBX itself; else read `MODELS.md` (written by `pf-model-gen`) and each listed model's `model.gen.json` `facts`. Then decide at spine altitude, or record under Deferred or open questions with an owner: (1) where a metre-scale 3D world sits on the framework rig (1 px = 1 world unit, the scaler-owned orthographic camera), which settles `model_import_scale`: the one place a metre becomes world units. A 3D camera or a new RenderLayer is a spine change, so route it. (2) The model import pipeline: where models and clips land under `Assets/<Sku>/`, that scale applied once, loop flags, how the `M_<palette key>` materials remap to the SKU's shader, and which importer step or Editor generator owns that. (3) How models are loaded and pooled (Addressables vs direct references), with the visible-instance count checked against the GDD's triangle budget. (4) Who plays motion: clip-driven models (an Animator or a clip player, and who owns the state that picks a clip) vs parts a View moves in code (`code_parts`), and that clip playback advances on the fixed tick (rule 15) or is explicitly presentation-only. If the sources describe a 3D world but the package has neither file, say so in one line and recommend `pf-model-gen` from bmad-ux, then `pf-ux-asset-handoff`, before `bmad-create-epics-and-stories`.",
